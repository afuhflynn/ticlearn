services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    container_name: ticlearn-postgres
    environment:
      POSTGRES_USER: ticlearn
      POSTGRES_PASSWORD: ticlearn_password
      POSTGRES_DB: ticlearn
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticlearn -d ticlearn"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticlearn-network

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    container_name: ticlearn-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ticlearn.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ticlearn-network

volumes:
  pgdata:
  pgadmin-data:

networks:
  ticlearn-network:
    driver: bridge
